<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Improfy · Figma-Vorlagen</title>
<style>
  :root{ --navy:#1e293b; --muted:#64748b; --green:#12a150; --green-d:#0e7d3f; --line:#e6e9ef; --bg:#f5f7fa; }
  *{ box-sizing:border-box; }
  body{ font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; margin:0; background:var(--bg); color:var(--navy); }
  header{ background:#fff; padding:14px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; }
  header img{ height:32px; } header b{ font-size:16px; }
  header a{ margin-left:auto; color:var(--green-d); font-weight:600; text-decoration:none; font-size:14px; }
  main{ max-width:1000px; margin:26px auto; padding:0 18px 60px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-bottom:18px; box-shadow:0 1px 3px rgba(16,24,40,.05); }
  h1{ font-size:20px; margin:0 0 4px; } .hint{ color:var(--muted); font-size:13px; }
  label{ display:block; font-size:12.5px; font-weight:600; color:#475569; margin:12px 0 5px; }
  input[type=text]{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; }
  .btn{ background:var(--green); color:#fff; border:none; border-radius:10px; padding:11px 18px; font-weight:700; cursor:pointer; font-size:14px; }
  .btn:hover{ background:var(--green-d); }
  .btn.sec{ background:#eafaf0; color:var(--green-d); border:1px solid #bfe8cd; }
  .status{ font-size:13px; margin-left:10px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; margin-top:16px; }
  .tpl{ border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; }
  .tpl .thumb{ height:220px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; }
  .tpl .thumb img{ max-width:100%; max-height:100%; }
  .tpl .cap{ padding:10px 12px; font-size:13px; }
  .tpl .cap b{ display:block; } .tpl .cap span{ color:var(--muted); font-size:12px; }
  .ok{ color:var(--green-d); font-weight:600; } .warn{ color:#b45309; }
</style></head>
<body>
<header>
  <img src="/static/improfy-logo.png" alt="Improfy">
  <b>Figma-Vorlagen</b>
  <a href="/">← zurück zur App</a>
</header>
<main>
  <div class="card">
    <h1>Vorlagen aus Figma laden</h1>
    <p class="hint">Token-Status:
      {% if token_ok %}<span class="ok">✓ Figma-Token hinterlegt</span>
      {% else %}<span class="warn">⚠ Kein Token – bitte FIGMA_TOKEN in <code>cv_system/.env</code> eintragen und App neu starten</span>{% endif %}
    </p>
    <label>Figma-Datei-ID (aus dem Link)</label>
    <input type="text" id="fileKey" value="{{ file_key }}">
    <div style="margin-top:14px">
      <button class="btn" onclick="ladeFrames()">📂 Vorlagen laden</button>
      <span class="status" id="status"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</main>
<script>
async function ladeFrames(){
  const st=document.getElementById('status'); const grid=document.getElementById('grid');
  const key=document.getElementById('fileKey').value.trim();
  st.textContent='⏳ lade …'; grid.innerHTML='';
  try{
    const r=await fetch('/figma/frames?file='+encodeURIComponent(key));
    const j=await r.json();
    if(!r.ok){ st.innerHTML='<span class="warn">⚠ '+(j.error||'Fehler')+'</span>'; return; }
    st.innerHTML='<span class="ok">✓ '+j.frames.length+' Vorlagen in „'+(j.name||'')+'"</span>';
    if(!j.frames.length){ grid.innerHTML='<p class="hint">Keine Frames gefunden.</p>'; return; }
    // Vorschaubilder für alle Frames auf einmal holen
    const ids=j.frames.map(f=>f.id).join(',');
    const ir=await fetch('/figma/image?file='+encodeURIComponent(key)+'&format=png&ids='+encodeURIComponent(ids));
    const ij=await ir.json(); const imgs=(ij.images)||{};
    grid.innerHTML=j.frames.map(f=>
      '<div class="tpl"><div class="thumb">'+(imgs[f.id]?'<img src="'+imgs[f.id]+'">':'<span class="hint">keine Vorschau</span>')+'</div>'
      +'<div class="cap"><b>'+esc(f.name)+'</b><span>'+esc(f.page)+'</span></div></div>').join('');
  }catch(e){ st.innerHTML='<span class="warn">⚠ '+e+'</span>'; }
}
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
</script>
</body></html>
